    /* Certifications Page Styles */
.certifications-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-top: 20px;
}

.cert-card {
  background: var(--glass);
  padding: 16px;
  border-radius: 10px;
  border-left: 4px solid var(--accent);
  transition: transform 0.2s ease, background 0.2s ease;
}

.cert-card:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.05);
}

.cert-card.view-all {
  background: linear-gradient(135deg, rgba(75, 163, 255, 0.1), rgba(0, 245, 160, 0.1));
  border-left: 4px solid #00f5a0;
}

.cert-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 13px;
}

.cert-category {
  background: rgba(75, 163, 255, 0.2);
  color: var(--accent);
  padding: 4px 8px;
  border-radius: 6px;
  font-weight: 600;
}

.cert-date {
  color: var(--muted);
  font-size: 12px;
}

.cert-card h3 {
  margin: 0 0 6px 0;
  font-size: 16px;
  line-height: 1.3;
}

.cert-subtitle {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 12px 0;
}

.filter-btn {
  cursor: pointer;
  border: none;
  background: rgba(255, 255, 255, 0.02);
  color: var(--muted);
  transition: all 0.2s ease;
}

.filter-btn.active {
  background: var(--accent);
  color: #021018;
  font-weight: 700;
}

.filter-btn:hover:not(.active) {
  background: rgba(255, 255, 255, 0.05);
}

/* Responsive */
@media (max-width: 600px) {

  <script>
    // Simple client-side router using hash routes + dynamic injection from templates
    const routes = {
      '/': 'tpl-home',
      '/about': 'tpl-about',
      '/projects': 'tpl-projects',
      '/skills': 'tpl-skills',
      '/certificates': 'tpl-certificates',
      '/contact': 'tpl-contact'
    };
    // Certification Filtering Functionality
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('filter-btn')) {
        // Update active button
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        e.target.classList.add('active');
        
        // Filter certifications
        const filter = e.target.dataset.filter;
        const certs = document.querySelectorAll('.cert-card');
        
        certs.forEach(cert => {
          if (filter === 'all' || cert.dataset.category === filter || cert.classList.contains('view-all')) {
            cert.style.display = 'block';
          } else {
            cert.style.display = 'none';
          }
        });
      }
    });

    // Initialize filter on certificates page load
    function initCertificatesFilter() {
      if (location.hash.includes('certificates')) {
        setTimeout(() => {
          document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
          document.querySelector('.filter-btn[data-filter="all"]')?.classList.add('active');
        }, 100);
      }
    }

    // Call init on hash change
    window.addEventListener('hashchange', initCertificatesFilter);
    function setActiveNav(path){
      document.querySelectorAll('.nav-link').forEach(a=>a.classList.remove('active'));
      const link = document.querySelector(`nav a[href="#${path}"]`);
      if(link) link.classList.add('active');
    }

    function render(){
      const hash = location.hash.replace('#','') || '/';
      const tplId = routes[hash] ? routes[hash] : 'tpl-home';
      const tpl = document.getElementById(tplId);
      const app = document.getElementById('app');
      app.innerHTML = tpl.innerHTML;
      setActiveNav(hash);
      // small UX: focus first heading
      const h = app.querySelector('h2, h1'); if(h) h.tabIndex = -1; try{h && h.focus()}catch(e){}
    }

    // attach link handlers for internal links
    document.addEventListener('click', e=>{
      const a = e.target.closest('a[data-link]');
      if(!a) return;
      e.preventDefault();
      const href = a.getAttribute('href');
      location.hash = href.replace('#','');
    });

    window.addEventListener('hashchange', render);
    // initial render
    render();
  </script>
